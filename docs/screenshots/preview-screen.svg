<svg width="360" height="780" viewBox="0 0 360 780" xmlns="http://www.w3.org/2000/svg">
  <rect width="360" height="780" fill="#F6F7FB"/>
  <rect x="20" y="20" width="320" height="740" rx="16" fill="#FFFFFF" stroke="#DADDE5"/>

  <text x="40" y="60" font-family="Arial, sans-serif" font-size="20" fill="#1F2937">Message Preview</text>

  <rect x="40" y="90" width="280" height="520" rx="10" fill="#F2E9B1" stroke="#D8CF97"/>
  <text x="56" y="124" font-family="Arial, sans-serif" font-size="12" fill="#1F2937">Hi John,</text>
  <text x="56" y="150" font-family="Arial, sans-serif" font-size="12" fill="#1F2937">My name is Sarah and I am</text>
  <text x="56" y="170" font-family="Arial, sans-serif" font-size="12" fill="#1F2937">an Android Developer.</text>
  <text x="56" y="206" font-family="Arial, sans-serif" font-size="12" fill="#1F2937">I have a portfolio of apps</text>
  <text x="56" y="226" font-family="Arial, sans-serif" font-size="12" fill="#1F2937">to demonstrate my skills.</text>
  <text x="56" y="262" font-family="Arial, sans-serif" font-size="12" fill="#1F2937">I am able to start immediately.</text>
  <text x="56" y="298" font-family="Arial, sans-serif" font-size="12" fill="#1F2937">Please get in touch if you</text>
  <text x="56" y="318" font-family="Arial, sans-serif" font-size="12" fill="#1F2937">have suitable roles for me.</text>
  <text x="56" y="354" font-family="Arial, sans-serif" font-size="12" fill="#1F2937">Thanks and best regards.</text>

  <rect x="100" y="640" width="160" height="46" rx="10" fill="#5A67D8"/>
  <text x="126" y="668" font-family="Arial, sans-serif" font-size="14" fill="#FFFFFF">Send Message</text>
</svg>

